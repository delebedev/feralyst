<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Skirmish | Feralyst</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <svg class="icon-definitions" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <symbol id="icon-settings" viewBox="0 0 24 24">
          <path
            d="m9 3-.5 2-2 1-2-.5-2 3.5 1.5 1.5v3L2.5 15l2 3.5 2-.5 2 1 .5 2h6l.5-2 2-1 2 .5 2-3.5-1.5-1.5v-3L21.5 9l-2-3.5-2 .5-2-1L15 3Z"
          />
          <circle cx="12" cy="12" r="3" />
        </symbol>
        <symbol id="icon-actions" viewBox="0 0 24 24">
          <path
            d="m4 3 8 8-3 3-8-8 3-3Zm16 0-8 8 3 3 8-8-3-3ZM7 16l-4 4m14-4 4 4M5 14l5 5m4 0 5-5"
          />
        </symbol>
        <symbol id="icon-end" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6" /></symbol>
        <symbol id="icon-shot" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="7" />
          <path d="M12 2v5m0 10v5M2 12h5m10 0h5" />
        </symbol>
        <symbol id="icon-heal" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></symbol>
        <symbol id="icon-flight" viewBox="0 0 24 24"><path d="m5 12 7-7 7 7M12 5v14" /></symbol>
        <symbol id="icon-history" viewBox="0 0 24 24">
          <path d="M3 11a9 9 0 1 1 3 8M3 5v6h6m3-4v5l3 2" />
        </symbol>
      </defs>
    </svg>
    <main>
      <header>
        <details id="settings">
          <summary aria-label="Battle settings">
            <svg aria-hidden="true"><use href="#icon-settings" /></svg>
          </summary>
          <div class="settings-menu">
            <button id="restart">Restart</button>
          </div>
        </details>
      </header>
      <h2 id="status" aria-live="polite">Loading battlefield…</h2>
      <div class="battle">
        <div
          id="game"
          role="img"
          aria-label="Five by six battlefield. Your north side is blue at the bottom; south is rust at the top. Enemy flyers are above the ground formation; your flyers are below it. Flyers stay in the separate air zone. Tap a creature, then a highlighted target."
        ></div>
        <section aria-label="Battle controls">
          <p id="prompt" role="status"></p>
          <details id="creature-info">
            <summary id="selected-name">Tap a creature</summary>
            <p id="inspection"></p>
          </details>
          <div id="action-menu" hidden>
            <button id="shot" hidden aria-pressed="false">
              <svg aria-hidden="true"><use href="#icon-shot" /></svg
              ><span class="sr-only">Shot 1/2/3</span>
            </button>
            <button id="heal" hidden aria-pressed="false">
              <svg aria-hidden="true"><use href="#icon-heal" /></svg
              ><span class="sr-only">Heal 2</span>
            </button>
            <button id="prepare-flight" hidden>
              <svg aria-hidden="true"><use href="#icon-flight" /></svg
              ><span class="sr-only">Prepare air strike</span>
            </button>
            <details id="history">
              <summary aria-label="Battle history">
                <svg aria-hidden="true"><use href="#icon-history" /></svg>
              </summary>
              <pre id="log" aria-label="Latest battle events"></pre>
            </details>
          </div>
          <button
            id="actions-toggle"
            aria-label="Open battle actions"
            aria-expanded="false"
            aria-controls="action-menu"
          >
            <svg aria-hidden="true"><use href="#icon-actions" /></svg>
          </button>
          <button id="end-turn" aria-label="End turn">
            <svg aria-hidden="true"><use href="#icon-end" /></svg>
          </button>
          <button id="take-attack" hidden aria-label="Take the attack">
            <svg aria-hidden="true"><use href="#icon-end" /></svg>
          </button>
        </section>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
