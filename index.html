<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Skirmish | Feralyst</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main>
      <header>
        <h1>Feralyst skirmish</h1>
        <button id="restart">Restart</button>
      </header>
      <h2 id="status" aria-live="polite">Loading battlefield…</h2>
      <div class="battle">
        <div
          id="game"
          role="img"
          aria-label="Five by six battlefield. Your north side is blue at the bottom; south is rust at the top. Tap a creature, then a highlighted target."
        ></div>
        <section aria-label="Battle controls">
          <p id="prompt" role="status"></p>
          <p id="inspection"></p>
          <div class="actions">
            <button id="heal" hidden aria-pressed="false">Heal 2</button>
            <button id="end-turn">End turn</button
            ><button id="take-attack" hidden>Take the attack</button>
          </div>
          <pre id="log" aria-label="Latest battle events"></pre>
        </section>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
